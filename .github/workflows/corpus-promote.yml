# Make a contributed recording a regression test. GitHub only lets people with write
# access to this repo run a workflow_dispatch; merging the pull request it opens is what
# makes the recording count. See corpus/README.md.
name: corpus-promote

on:
  workflow_dispatch:
    inputs:
      submission:
        description: The submission's ID, from trunkrecorder.pro/corpus
        required: true
      state:
        description: active, or known-failing for a capture of a bug
        required: true
        default: active
        type: choice
        options: [active, known-failing]
      issue:
        description: The GitHub issue it's for, if any
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern 'trunk-pro-*-linux-x86_64.tar.gz' --dir /tmp/rel
          tar -xzf /tmp/rel/*.tar.gz -C /tmp/rel
          cp "$(find /tmp/rel -type f -name trunk-pro | head -1)" /tmp/trunk-pro
      - name: Add it to the manifest, with what this version decodes from it
        env:
          SUBMISSION: ${{ inputs.submission }}
          STATE: ${{ inputs.state }}
          ISSUE: ${{ inputs.issue }}
        run: /tmp/trunk-pro tool corpus promote "$SUBMISSION" --state "$STATE" ${ISSUE:+--issue "$ISSUE"}
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMISSION: ${{ inputs.submission }}
          ACTOR: ${{ github.actor }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "corpus/$SUBMISSION"
          git add corpus
          git commit -m "Corpus: promote submission $SUBMISSION"
          git push origin "corpus/$SUBMISSION"
          gh pr create --title "Corpus: promote submission $SUBMISSION" --body "Requested by @$ACTOR. Details at https://trunkrecorder.pro/corpus."
