[package]
name = "trunk-lite"
description = "Trunk Recorder Lite: record a P25 trunked system from SDRs, with a browser interface."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "trunk-lite"
path = "src/main.rs"

[dependencies]
trunk-core.workspace = true
trunk-app.workspace = true
serde_json.workspace = true
rtlsdr-nusb = "0.3"
serde.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs"] }
axum = { version = "0.8", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
