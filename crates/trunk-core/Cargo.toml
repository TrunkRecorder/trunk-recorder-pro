[package]
name = "trunk-core"
description = "Trunked and conventional radio (P25, SmartNet, DMR, analog FM) decoding and call recording: channelizer, receivers, FEC, vocoders, trunking. Platform-independent (native and WebAssembly)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The call record (CallRecord): the type plugins read it as.
trunk-recorder-plugin.workspace = true
rustfft.workspace = true
num-complex.workspace = true
regex-lite = "0.1"
# P25 decryption (p25::crypt): DES / 3DES and AES block ciphers. Pure Rust.
des = { version = "0.9", features = ["zeroize"] }
aes = { version = "0.9", features = ["zeroize"] }
# Key bytes are wiped when dropped.
zeroize = "1"
# MimoSDR's .sdr call container (frame capture). Zero dependencies.
sdr_stream = { package = "sdr-stream", version = "1.9" }

[dev-dependencies]
# MimoSDR's own .sdr player (tests/mimosdr.rs): our files must play there as they do here.
sdr_decode = { package = "sdr-decode", version = "0.10" }
