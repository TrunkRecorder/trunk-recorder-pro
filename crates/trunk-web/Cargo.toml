[package]
name = "trunk-web"
description = "Trunk Recorder Pro in the browser: the engine and the RTL-SDR driver (WebUSB) as WebAssembly, driven by web/src/web/engine.worker.ts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
trunk-app.workspace = true
trunk-core.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
rtlsdr-nusb = "0.3"
