[package]
name = "trunk-recorder-plugin"
description = "Plugins for Trunk Recorder Pro: the wire protocol between the recorder and a plugin process, and an SDK for writing plugins in Rust."
# The crate's version tracks the plugin API, not the app's.
version = "0.1.0"
edition.workspace = true
# Permissive, so a plugin can be licensed however its author likes.
license = "MIT OR Apache-2.0"
repository.workspace = true

[features]
default = ["sdk"]
# The plugin side: `run`, the `Plugin` trait, config schemas. The recorder
# uses the protocol types only (default-features = false).
sdk = ["dep:schemars", "schemars/preserve_order"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars = { version = "1", optional = true }
