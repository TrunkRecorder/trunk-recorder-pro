[package]
name = "trunk-pro"
description = "Trunk Recorder Pro: record a P25 trunked system from SDRs, with a browser interface."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "trunk-pro"
path = "src/main.rs"

[dependencies]
trunk-core.workspace = true
trunk-app.workspace = true
trunk-recorder-plugin.workspace = true
serde_json.workspace = true
rtlsdr-nusb = "0.3"
# Asking whether a dongle is free (sdr::devices): the version rtlsdr-nusb uses.
nusb = "0.2"
# USRP (UHD) and Airspy (libairspy) are loaded at run time when installed.
libloading = "0.8"
num-complex.workspace = true
serde.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs", "signal"] }
axum = { version = "0.8", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The `log` facade: messages anywhere in the app go to the logger (logging.rs).
log = { version = "0.4", features = ["std"] }
# The plugin store (plugins/store.rs): the registry and release downloads,
# over rustls so builds still cross-compile; checksums; .tar.gz and .zip.
ureq = "3"
sha2 = "0.11"
# Account salts and session tokens (auth.rs).
getrandom = "0.3"
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
jsonschema = { version = "0.58.4", default-features = false }
