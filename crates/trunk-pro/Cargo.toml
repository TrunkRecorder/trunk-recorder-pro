[package]
name = "trunk-pro"
description = "Trunk Recorder Pro: record a P25 trunked system from SDRs, with a browser interface."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "trunk-pro"
path = "src/main.rs"

[dependencies]
trunk-core.workspace = true
trunk-app.workspace = true
trunk-recorder-plugin.workspace = true
serde_json.workspace = true
rtlsdr-nusb = "0.3"
# USRP (UHD) and Airspy (libairspy) are loaded at run time when installed.
libloading = "0.8"
num-complex.workspace = true
serde.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs", "signal"] }
axum = { version = "0.8", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
