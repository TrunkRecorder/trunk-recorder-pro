[package]
name = "trunk-pro"
description = "Trunk Recorder Pro: record P25, SmartNet and DMR trunked systems and conventional channels from SDRs, with a browser interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "trunk-pro"
path = "src/main.rs"

[dependencies]
# A key container's password, typed into the interface, is wiped after use.
zeroize = "1"
trunk-core.workspace = true
trunk-app.workspace = true
trunk-recorder-plugin.workspace = true
serde_json.workspace = true
rtlsdr-nusb = "0.3"
# Asking whether a dongle is free (radio::rtl::devices): the version rtlsdr-nusb uses.
nusb = "0.2"
# sdr-core for HackRF's types (and sdr-hackrf's).
sdr-core = "0.1"
# USRP (UHD) and Airspy (libairspy) are loaded at run time when installed.
libloading = "0.8"
num-complex.workspace = true
serde.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs", "signal"] }
axum = { version = "0.8", features = ["ws"] }
# (Streams a CSV export as it's read: already axum's.)
futures-util = { version = "0.3", default-features = false }
rust-embed = "8"
mime_guess = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The `log` facade: messages anywhere in the app go to the logger (logging.rs).
log = { version = "0.4", features = ["std"] }
# The plugin store (plugins/store.rs): the registry and release downloads,
# over rustls so builds still cross-compile; checksums; .tar.gz and .zip.
ureq = "3"
# HTTPS (tls.rs): over the rustls (and ring) ureq has, pure Rust, no OpenSSL.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.11"
# Signing browsers' sessions (access.rs): the version trunk-app has.
hmac = "0.13"
# Passkeys (access/passkey.rs): WebAuthn's checks, over RustCrypto (no OpenSSL, no C).
# No attestation (any authenticator will do); conditional-ui: signing in with
# no name typed (discoverable credentials); danger-allow-state-serialisation: a
# sign-in waiting kept by the browser, signed, not in memory (serde derives, no more crates).
webauthn-rs = { version = "0.6.2", default-features = false, features = ["conditional-ui", "danger-allow-state-serialisation"] }
# Passkeys' credential ids (base64url): the version trunk-app has.
base64 = "0.23"
# Cloudflare Access's tokens (access/cloudflare.rs): RS256, with the ring rustls has already.
ring = "0.17"
cel = "0.15"
rustfft.workspace = true
# The install's anonymous directory recorder ID (directory.rs).
getrandom = "0.3"
flate2 = "1"
# The call store (db/): bundled SQLite, no system library.
rusqlite = { version = "0.41", features = ["bundled"] }
# The call store on a PostgreSQL server (storage.backend "postgres"): pure Rust.
postgres = { version = "0.19", features = ["with-serde_json-1"] }
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network", "component"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# HackRF, pure Rust over the same nusb (MimoCAD). Not on Windows: its control
# transfers are the device's, which nusb has only through an interface there.
[target.'cfg(not(windows))'.dependencies]
sdr-hackrf = "0.1"

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[dev-dependencies]
# A software authenticator for the passkey tests (access/passkey.rs): what webauthn-rs has already.
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
serde_cbor_2 = "0.13"
jsonschema = { version = "0.58.4", default-features = false }
tokio-tungstenite = "0.29"
