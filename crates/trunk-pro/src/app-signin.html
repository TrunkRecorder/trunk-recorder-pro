<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in an app</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #5d6670; --line: #d4d9df; --accent: #2563eb; --bad: #b42318; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1216; --card: #181c22; --text: #e6e9ed; --muted: #9aa4ae; --line: #2c333c; --accent: #6b9bff; --bad: #ff8a80; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: grid; gap: 12px; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .sub { margin: 0; color: var(--muted); font-size: 13px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  dt { color: var(--muted); font-size: 13px; }
  dd { margin: 0; font-weight: 600; text-align: right; overflow-wrap: anywhere; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { padding: 9px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 6px; cursor: pointer; }
  button.quiet { color: var(--text); background: transparent; border: 1px solid var(--line); }
  button:disabled { opacity: .6; cursor: default; }
  select { font: inherit; font-weight: 600; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; }
  .warn { color: var(--bad); }
  .code { display: grid; gap: 8px; }
  .code code { display: block; padding: 10px; border: 1px solid var(--line); border-radius: 6px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; user-select: all; }
  .done { margin: 0; font-weight: 600; text-align: center; }
  .error { margin: 0; min-height: 1.4em; color: var(--bad); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Trunk Recorder Pro</h1>
  <p class="sub">Sign in an app</p>
  <dl>
    <dt>App</dt><dd id="app">…</dd>
    <dt>User</dt><dd id="user">…</dd>
    <dt>Access</dt><dd><span id="access">…</span><select id="pick" hidden aria-label="Access"><option value="listen">View</option><option value="control">Admin</option></select></dd>
    <dt>Returns to</dt><dd id="returns">…</dd>
    <dt id="plain-t" hidden>Connection</dt><dd id="plain" class="warn" hidden>Unencrypted</dd>
  </dl>
  <div class="row" id="ask">
    <button id="no" type="button" class="quiet">Cancel</button>
    <button id="yes" type="button" disabled>Allow</button>
  </div>
  <div class="code" id="paste" hidden>
    <code id="code"></code>
    <button id="copy" type="button">Copy code</button>
  </div>
  <p class="done" id="done" hidden></p>
  <p class="error" id="e" role="alert"></p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  // What the app asked is this page's own query: the recorder reads it, here and when it's allowed.
  const request = location.search.slice(1);
  // What a role is called on the Access page.
  const role = (a) => (a === "control" ? "Admin" : a === "listen" ? "View" : "None");
  // Where the code goes: an app on this device, another site's page (its host), or shown here to copy.
  const returns = (a) => (a.returns === "device" ? "This device" : a.returns === "web" ? a.host : "Copy a code");
  // Whether this page crosses the network unencrypted: plain HTTP, from a host that isn't this computer.
  const unencrypted = (loc) => loc.protocol === "http:" && !/^(localhost|.*\.localhost|127(\.\d+){3}|\[::1\])$/.test(loc.hostname);
  // Said in place of the buttons: allowed, or not.
  const done = (text) => {
    $("ask").hidden = true;
    $("done").textContent = text;
    $("done").hidden = false;
  };
  let cancel = null;
  $("no").addEventListener("click", () => {
    done("Cancelled");
    if (cancel) location.replace(cancel);
  });
  $("yes").addEventListener("click", async () => {
    $("yes").disabled = true;
    $("e").textContent = "";
    try {
      const access = $("pick").hidden ? undefined : $("pick").value;
      const r = await fetch("/api/app/approve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ request, access }) });
      if (r.ok) {
        const a = await r.json();
        $("pick").disabled = true;
        if (a.to) {
          // (The app's link opens the app; this page stays behind it.)
          done("Allowed · Return to the app");
          return location.replace(a.to);
        }
        done("Allowed · Paste in the app");
        $("code").textContent = a.code;
        $("paste").hidden = false;
        return;
      }
      $("e").textContent = (await r.text()).trim() || "Failed: " + r.status;
    } catch {
      $("e").textContent = "No answer";
    }
    $("yes").disabled = false;
  });
  $("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText($("code").textContent);
      $("copy").textContent = "Copied";
    } catch {
      // (Plain HTTP has no clipboard: the code selects whole on a click.)
      getSelection().selectAllChildren($("code"));
    }
  });
  if (unencrypted(location)) $("plain-t").hidden = $("plain").hidden = false;
  fetch("/api/app/ask?" + request, { cache: "no-store" })
    .then(async (r) => {
      if (!r.ok) return ($("e").textContent = (await r.text()).trim() || "Failed: " + r.status);
      const a = await r.json();
      // The name is the app's own word for itself: shown as text, never as markup.
      $("app").textContent = a.app;
      $("user").textContent = a.user;
      $("access").textContent = role(a.access);
      $("returns").textContent = returns(a);
      // An Admin the app asked everything of may allow it less.
      if (a.access === "control") {
        $("pick").value = a.access;
        $("pick").hidden = false;
        $("access").hidden = true;
      }
      cancel = a.cancel || null;
      $("yes").disabled = false;
    })
    .catch(() => ($("e").textContent = "No answer"));
</script>
</body>
</html>
