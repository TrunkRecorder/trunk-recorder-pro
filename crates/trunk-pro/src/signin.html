<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #5d6670; --line: #d4d9df; --accent: #2563eb; --bad: #b42318; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1216; --card: #181c22; --text: #e6e9ed; --muted: #9aa4ae; --line: #2c333c; --accent: #6b9bff; --bad: #ff8a80; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  form { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: grid; gap: 12px; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .sub { margin: 0; color: var(--muted); font-size: 13px; }
  label { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
  input { width: 100%; padding: 9px 10px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button, a.button { padding: 9px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 6px; cursor: pointer; text-align: center; text-decoration: none; }
  button:disabled { opacity: .6; cursor: default; }
  .error { margin: 0; min-height: 1.4em; color: var(--bad); font-size: 13px; }
  .or { margin: 0; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<form id="f">
  <h1>Trunk Recorder Pro</h1>
  <p class="sub">Sign in</p>
  <button id="p" type="button" hidden>Passkey</button>
  <a id="pl" class="button" hidden>Passkey ↗</a>
  <p class="or" id="or" hidden>or</p>
  <label>Access token
    <input id="t" type="password" name="token" autocomplete="current-password webauthn" autofocus required>
  </label>
  <button id="b" type="submit">Sign in</button>
  <p class="error" id="e" role="alert"></p>
</form>
<script>
  const f = document.getElementById("f"), t = document.getElementById("t"), b = document.getElementById("b"), e = document.getElementById("e"), p = document.getElementById("p"), pl = document.getElementById("pl");
  // Asked for at /signin: on to the start page; in place of another page: that page again.
  const signedIn = () => (location.pathname === "/signin" ? location.replace("/") : location.reload());
  f.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    b.disabled = true;
    e.textContent = "";
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: t.value.trim() }) });
      if (r.ok) return signedIn();
      e.textContent = r.status === 401 ? "Not a token here" : "Failed: " + r.status;
    } catch {
      e.textContent = "No answer";
    }
    b.disabled = false;
    t.select();
  });

  // Passkeys: where the recorder says they work, at the one origin it says (the dashboard's). WebAuthn, its binary values base64url.
  const bytes = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));
  const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body ?? {}) });
  let autofill = null;
  // Signed in with a passkey: `conditional`, offered in the token field's autofill as well (until the button's pressed).
  async function passkey(conditional) {
    autofill?.abort();
    const ac = new AbortController();
    if (conditional) autofill = ac;
    const r = await post("/api/passkey/login/start");
    if (!r.ok) throw new Error(await r.text());
    const { id, options } = await r.json();
    const pk = options.publicKey;
    pk.challenge = bytes(pk.challenge);
    for (const c of pk.allowCredentials ?? []) c.id = bytes(c.id);
    const cred = await navigator.credentials.get({ publicKey: pk, signal: ac.signal, ...(conditional ? { mediation: "conditional" } : {}) });
    const a = cred.response;
    const response = { authenticatorData: b64url(a.authenticatorData), clientDataJSON: b64url(a.clientDataJSON), signature: b64url(a.signature), userHandle: a.userHandle ? b64url(a.userHandle) : null };
    const done = await post("/api/passkey/login/finish", { id, credential: { id: cred.id, rawId: b64url(cred.rawId), type: cred.type, extensions: {}, response } });
    if (done.ok) return signedIn();
    throw new Error(done.status === 401 ? "Not a passkey here" : "Failed: " + done.status);
  }
  const failed = (x) => {
    // (Cancelled, or replaced by the button's: nothing to say.)
    if (x?.name === "AbortError") return;
    e.textContent = x?.name === "NotAllowedError" ? "No passkey used" : String(x?.message || x).trim() || "Failed";
  };
  p.addEventListener("click", async () => {
    p.disabled = true;
    e.textContent = "";
    await passkey(false).catch(failed);
    p.disabled = false;
  });
  // "here": this page is at their origin; "there": another port or address (an interface's, a tunnel's), so a link to theirs (its cookie is this host's too); null: none.
  const passkeysAt = (s, origin) => (!s.passkeyOrigin ? null : s.passkeys && s.passkeyOrigin === origin ? "here" : "there");
  // Whether anything answers at `origin` within 3 s (its answer unread: another origin's; a refused connection or a bad certificate doesn't).
  const answers = (origin) => fetch(origin + "/api/version", { mode: "no-cors", cache: "no-store", signal: AbortSignal.timeout(3000) }).then(() => true, () => false);
  fetch("/api/session", { cache: "no-store" })
    .then((r) => r.json())
    .then(async (s) => {
      const at = passkeysAt(s, location.origin);
      if (at === "there") {
        // Only if something answers there (nothing serving HTTPS on the host name: no link to nowhere).
        if (!(await answers(s.passkeyOrigin))) return;
        pl.href = s.passkeyOrigin + "/signin";
        pl.title = s.passkeyOrigin;
        pl.hidden = document.getElementById("or").hidden = false;
        return;
      }
      if (at !== "here" || !window.PublicKeyCredential) return;
      p.hidden = document.getElementById("or").hidden = false;
      if (await PublicKeyCredential.isConditionalMediationAvailable?.()) passkey(true).catch(failed);
    })
    .catch(() => {});
</script>
</body>
</html>
