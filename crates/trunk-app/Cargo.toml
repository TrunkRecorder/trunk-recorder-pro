[package]
name = "trunk-app"
description = "Trunk Recorder Pro's app layer shared by the desktop app and the web build: config, and a Session that turns the engine's events into interface messages, live audio and call files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
trunk-core.workspace = true
trunk-recorder-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
# KFDtool's encrypted key container (`ekc`): PBKDF2-HMAC-SHA512, AES-256-CBC, compressed XML. Pure Rust.
pbkdf2 = "0.13.0"
sha2 = "0.11.1"
hmac = "0.13.0"
aes = { version = "0.9.3", features = ["zeroize"] }
cbc = { version = "0.2.1", features = ["zeroize"] }
roxmltree = "0.21.1"
base64 = "0.23.1"
zeroize = "1.9.1"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
