[package]
name = "trunk-recorder-plugin"
description = "Plugins for Trunk Recorder Pro: the wire protocol between the recorder and a plugin process, and an SDK for writing plugins in Rust."
# The crate's version tracks the plugin API, not the app's.
version = "0.14.0"
edition = "2024"
# Kept as low as edition 2024 allows: plugin authors build against this.
rust-version = "1.85"
# Permissive, so a plugin can be licensed however its author likes.
license = "MIT OR Apache-2.0"
repository = "https://github.com/TrunkRecorder/trunk-recorder-pro"
homepage = "https://github.com/TrunkRecorder/trunk-plugin-template"
documentation = "https://docs.rs/trunk-recorder-plugin"
readme = "README.md"
keywords = ["trunk-recorder", "radio", "scanner", "p25", "plugin"]
categories = ["development-tools", "multimedia::audio"]

[features]
default = ["sdk"]
# The plugin side: `run`, the `Plugin` trait, config schemas. The recorder
# uses the protocol types only (default-features = false).
sdk = ["dep:schemars", "schemars/preserve_order"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
schemars = { version = "1", optional = true }
