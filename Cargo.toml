[workspace]
resolver = "3"
members = ["crates/trunk-core", "crates/trunk-app", "crates/trunk-pro", "crates/trunk-web", "crates/trunk-recorder-plugin"]

[workspace.package]
version = "0.1.9"
edition = "2024"
# The oldest Rust that builds the app (sysinfo needs 1.95). The plugin SDK
# sets its own, lower one.
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/TrunkRecorder/trunk-recorder-pro"

[workspace.dependencies]
trunk-core = { path = "crates/trunk-core" }
trunk-app = { path = "crates/trunk-app" }
trunk-recorder-plugin = { path = "crates/trunk-recorder-plugin", default-features = false }
rustfft = "6"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Debug builds optimize a little: unoptimized, the DSP runs ~100x slower
# than release (every Complex32 op, iterator step and NEON intrinsic is a
# call plus a UB check) and can't keep up with a live dongle. opt-level 1 is
# ~2x release and still debuggable.
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

# Release artifacts: no debug info, stripped (`--profile dist`).
[profile.dist]
inherits = "release"
debug = false
strip = true
